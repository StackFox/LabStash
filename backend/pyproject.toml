[project]
name = "LabStash_backend"
version = "0.1.0"
description = "Backend for LabStash"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.65",
    "fastapi[standard]>=0.141.1",
    "python-dotenv>=1.2.2",
    "psycopg[binary,pool]>=3.2.10",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
